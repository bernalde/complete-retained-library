name: Check source snapshot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact source and payload identities
        run: python3 -B scripts/verify_snapshot.py
      - name: Check snapshot privacy guard behavior
        run: python3 -B -m unittest discover -s tests -v
